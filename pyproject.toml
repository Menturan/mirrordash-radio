[project]
name = "mirrordash-radio"
version = "1.0.0"
description = "Internet radio on the mirror: Sveriges Radio and stations worldwide, with what's on now"
requires-python = ">=3.14"
license = "MIT"  # LICENSE: yours to change; the template it came from asks nothing (MIT-0)
license-files = ["LICENSE"]
authors = [
    { name = "Menturan" }
]
# The mirror provides the rest (rendering, fetch_json/fetch, translations, fastapi); add only what else
# plugin.py imports
dependencies = []

[project.entry-points."mirrordash.modules"]
mirrordash_radio = "mirrordash_radio.plugin:RadioModule"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.115",  # the mirror's, for the tests of a module with its own web address
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_radio"]
